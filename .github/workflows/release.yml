name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Install build tools
              run: python -m pip install build packaging

            - name: Check package version
              id: version
              run: python .github/scripts/check_release.py

            - name: Build wheel and source distribution
              if: steps.version.outputs.publish == 'true'
              run: python -m build

            - name: Verify installed wheel
              if: steps.version.outputs.publish == 'true'
              run: |
                  python -m venv /tmp/wpb-release-check
                  /tmp/wpb-release-check/bin/python -m pip install dist/*.whl
                  cd /tmp
                  /tmp/wpb-release-check/bin/willow-package-builder --help

            - name: Publish GitHub release
              if: steps.version.outputs.publish == 'true'
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
              run: |
                  if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
                    gh release create "$RELEASE_TAG" \
                      --target "$GITHUB_SHA" \
                      --title "$RELEASE_TAG" \
                      --generate-notes \
                      --draft
                  fi
                  gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
                  gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_PRERELEASE"

            - name: Update latest stable release tag
              if: steps.version.outputs.prerelease == 'false'
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  release_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
                  if gh api "repos/$GH_REPO/git/ref/tags/latest" > /dev/null 2>&1; then
                    gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
                      -f sha="$release_sha" -F force=true > /dev/null
                  else
                    gh api --method POST "repos/$GH_REPO/git/refs" \
                      -f ref=refs/tags/latest -f sha="$release_sha" > /dev/null
                  fi
                  gh release edit "$RELEASE_TAG" --latest
